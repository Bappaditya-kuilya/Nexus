<!doctype html>
<meta charset="utf-8" />
<title>Week 1 : Assignment 1 (legacy Course Builder fixture)</title>
<!--
  The OLD NPTEL portal (Google Course Builder). Plain server-rendered HTML,
  uncontrolled inputs, no framework.

  Kept as a fixture to prove the discovery heuristic covers both eras with one
  code path — legacy pages group radios by `name` exactly like the React ones do,
  which is why there is no separate "legacy selectors" tier in content.js.
-->
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; }
  .qt-mc-question { margin: 28px 0; padding: 18px; border: 1px solid #ddd; }
  .qt-question { font-weight: 600; margin-bottom: 10px; }
  .gcb-mcq-choice { margin: 6px 0; }
</style>

<div class="gcb-assessment-contents">
  <h1 class="assessment-title">Week 1 : Assignment 1</h1>

  <div class="qt-mc-question qt-embedded">
    <div class="qt-question">1) Which layer of the OSI model is responsible for routing packets between networks?</div>
    <div class="gcb-mcq-choice"><label><input type="radio" name="Q1" value="0" /> Data link layer</label></div>
    <div class="gcb-mcq-choice"><label><input type="radio" name="Q1" value="1" /> Network layer</label></div>
    <div class="gcb-mcq-choice"><label><input type="radio" name="Q1" value="2" /> Transport layer</label></div>
    <div class="gcb-mcq-choice"><label><input type="radio" name="Q1" value="3" /> Session layer</label></div>
  </div>

  <div class="qt-mc-question qt-embedded">
    <div class="qt-question">2) Which of the following protocols operate at the transport layer? Select all that apply.</div>
    <div class="gcb-mcq-choice"><label><input type="checkbox" name="Q2" value="0" /> TCP</label></div>
    <div class="gcb-mcq-choice"><label><input type="checkbox" name="Q2" value="1" /> UDP</label></div>
    <div class="gcb-mcq-choice"><label><input type="checkbox" name="Q2" value="2" /> ARP</label></div>
    <div class="gcb-mcq-choice"><label><input type="checkbox" name="Q2" value="3" /> ICMP</label></div>
  </div>

  <div class="qt-mc-question qt-embedded">
    <div class="qt-question">3) The default port number for HTTPS is ______.</div>
    <input type="text" name="Q3" size="20" />
  </div>

  <button id="submitbutton" onclick="alert('fixture: submit is never clicked by the extension')">Submit</button>
</div>
