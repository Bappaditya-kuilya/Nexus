<!doctype html>
<meta charset="utf-8" />
<title>Image-stem quiz fixture</title>
<!--
  Three questions:
    Q1 — stem is an <img> WITH descriptive alt; options are plain TEXT labels.
    Q2 — stem is an <img> with NO alt attribute at all.
    Q3 — normal text-prompt question with a text input (control).

  Expected: 3 questions; Q1's prompt is the stem alt, Q2's prompt is
  exactly "[Question image]", and both stem images land in q.images.

  The stems use inline base64 SVGs (width/height >= 50) so imagesIn() can
  fetch them offline and does not drop them for being under 50x50.
-->

  .q { margin: 26px 0; padding: 16px; border: 1px solid #e0e0e0; border-radius: 6px; }
  .q > img { display: block; border: 1px solid #ccc; border-radius: 4px; background: #fafafa; margin-bottom: 10px; }
  .q > p { font-weight: 600; margin-bottom: 10px; }
  label { display: block; margin: 6px 0; cursor: pointer; }
  input[type="text"] { padding: 6px 10px; border: 1px solid #bbb; border-radius: 4px; width: 260px; }
</style>
