<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=400">
  <title>Assignment Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <svg class="logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="11" stroke="#F67748" stroke-width="2"/>
        <path d="M7 12.5l3.5 3.5L17 9" stroke="#F67748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">Assignment Solver</span>
    </div>
    <button id="toggle-settings" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- Settings panel (slides down) -->
  <div id="settings" hidden>
    <div class="setting-group">
      <label for="key">API Key</label>
      <input id="key" type="password" placeholder="Paste your Gemini API key..." autocomplete="off" spellcheck="false">
    </div>
    <div class="setting-group">
      <label for="model">Model</label>
      <div class="model-row">
        <select id="model"></select>
        <button id="refresh-models" title="Refresh model list">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mode toggle (always visible) -->
  <div class="seg" role="radiogroup">
    <button data-mode="solve" role="radio" aria-checked="true" class="on">Solve</button>
    <button data-mode="hints" role="radio" aria-checked="false">Hints</button>
  </div>

  <!-- Status -->
  <p id="status" class="status"></p>

  <!-- Question list -->
  <main id="list"></main>

  <!-- Action bar (sticky bottom) -->
  <div id="actions">
    <button id="scan">Scan page</button>
    <button id="solve">Answer</button>
    <button id="fill">Fill page</button>
  </div>

  <footer>This never clicks Submit. Review answers before handing in.</footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
